<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Chat - Good Vibes Example</title>
    <style>
        :root {
            --primary-color: #10b981;
            --primary-dark: #059669;
            --secondary-color: #f59e0b;
            --accent-color: #8b5cf6;
            --text-color: #1f2937;
            --text-light: #6b7280;
            --text-white: #ffffff;
            --bg-color: #ffffff;
            --bg-light: #f9fafb;
            --bg-dark: #f3f4f6;
            --border-color: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background: var(--bg-light);
            height: 100vh;
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 1rem 0;
            box-shadow: var(--shadow);
            position: relative;
            z-index: 10;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .site-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }
        
        nav {
            display: flex;
            gap: 1.5rem;
        }
        
        .nav-link {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover, .nav-link.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        main {
            height: calc(100vh - 80px);
            overflow: hidden;
        }
        
        section {
            display: none;
            height: 100%;
            animation: fadeIn 0.3s ease-in;
        }
        
        section.active {
            display: flex;
            flex-direction: column;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(135deg, var(--bg-color), var(--bg-light));
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .hero p {
            font-size: 1.2rem;
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto 2rem;
        }
        
        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--primary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .cta-button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .chat-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
        }
        
        .chat-header {
            background: var(--bg-dark);
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .chat-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-color);
        }
        
        .chat-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-light);
            font-size: 0.9rem;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-color);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background: var(--bg-light);
        }
        
        .message {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1rem;
            opacity: 0;
            animation: messageSlideIn 0.5s ease-out forwards;
        }
        
        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .message.own {
            flex-direction: row-reverse;
        }
        
        .message.own .message-content {
            background: var(--primary-color);
            color: white;
        }
        
        .message.own .message-time {
            text-align: right;
        }
        
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        
        .message-bubble {
            max-width: 70%;
            flex: 1;
        }
        
        .message-content {
            background: white;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            box-shadow: var(--shadow);
            word-wrap: break-word;
        }
        
        .message-time {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 0.25rem;
        }
        
        .chat-input {
            background: white;
            padding: 1rem;
            border-top: 1px solid var(--border-color);
        }
        
        .input-container {
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
        }
        
        .message-input {
            flex: 1;
            background: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: border-color 0.3s ease;
        }
        
        .message-input:focus {
            border-color: var(--primary-color);
        }
        
        .send-button {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }
        
        .send-button:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }
        
        .send-button:disabled {
            background: var(--border-color);
            cursor: not-allowed;
            transform: none;
        }
        
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            color: var(--text-light);
            font-size: 0.9rem;
            font-style: italic;
        }
        
        .typing-dots {
            display: flex;
            gap: 0.25rem;
        }
        
        .typing-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-light);
            animation: typingDot 1.5s infinite;
        }
        
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typingDot {
            0%, 60%, 100% { transform: scale(1); }
            30% { transform: scale(1.5); }
        }
        
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }
            
            .hero h1 {
                font-size: 2rem;
            }
            
            .message-bubble {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <h1 class="site-title">💬 Vibe Chat</h1>
                <nav>
                    <a href="#home" class="nav-link active" aria-current="page">Home</a>
                    <a href="#chat" class="nav-link">Chat Room</a>
                </nav>
            </div>
        </div>
    </header>
    
    <main>
        <section id="home" class="active">
            <div class="hero">
                <h1>Welcome to Vibe Chat</h1>
                <p>Connect with fellow developers in a positive, supportive environment. Share ideas, get help, and build meaningful connections through good vibes and great conversations.</p>
                <a href="#chat" class="cta-button nav-link">
                    Join the Chat 💬
                </a>
            </div>
        </section>
        
        <section id="chat">
            <div class="chat-container">
                <div class="chat-header">
                    <h2 class="chat-title">Good Vibes Chat Room</h2>
                    <div class="chat-status">
                        <span class="status-dot"></span>
                        <span id="user-count">3 users online</span>
                    </div>
                </div>
                
                <div class="chat-messages" id="chat-messages">
                    <!-- Messages will be rendered here -->
                </div>
                
                <div class="typing-indicator" id="typing-indicator">
                    <span>Someone is typing</span>
                    <div class="typing-dots">
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                    </div>
                </div>
                
                <div class="chat-input">
                    <div class="input-container">
                        <textarea 
                            class="message-input" 
                            id="message-input" 
                            placeholder="Type your message here... Press Enter to send"
                            rows="1"
                        ></textarea>
                        <button class="send-button" id="send-button" disabled>
                            ➤
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <script>
        // Sample chat data
        const chatMessages = [
            {
                id: 1,
                user: "Alex",
                message: "Hey everyone! Just finished implementing a new feature with some really clean code. Feeling good about it! 🚀",
                time: "2025-01-07T10:30:00Z",
                own: false
            },
            {
                id: 2,
                user: "Sarah",
                message: "That's awesome Alex! Love hearing about those satisfying coding moments. What kind of feature were you working on?",
                time: "2025-01-07T10:32:00Z",
                own: false
            },
            {
                id: 3,
                user: "You",
                message: "Welcome to the vibe chat! This is such a positive space for developers 🌟",
                time: "2025-01-07T10:35:00Z",
                own: true
            },
            {
                id: 4,
                user: "Alex",
                message: "Thanks! It was a user dashboard with real-time updates. The state management just clicked and everything fell into place perfectly.",
                time: "2025-01-07T10:36:00Z",
                own: false
            },
            {
                id: 5,
                user: "Jordan",
                message: "Those moments when everything just works are the best! Nothing beats that feeling of clean, working code 💪",
                time: "2025-01-07T10:38:00Z",
                own: false
            }
        ];
        
        let messageId = chatMessages.length + 1;
        let typingTimeout;
        
        // Navigation functionality
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function(event) {
                event.preventDefault();
                const target = this.getAttribute('href').substring(1);
                
                // Update sections
                document.querySelectorAll('section').forEach(sec => {
                    sec.classList.toggle('active', sec.id === target);
                    sec.setAttribute('aria-hidden', sec.id !== target);
                });
                
                // Update navigation
                document.querySelectorAll('.nav-link').forEach(nav => {
                    const active = nav.getAttribute('href') === '#' + target;
                    nav.classList.toggle('active', active);
                    if (active) { 
                        nav.setAttribute('aria-current', 'page'); 
                    } else { 
                        nav.removeAttribute('aria-current'); 
                    }
                });
                
                // Initialize chat if navigating to chat section
                if (target === 'chat') {
                    setTimeout(() => {
                        scrollToBottom();
                    }, 100);
                }
            });
        });
        
        // Render message
        function renderMessage(msg) {
            const messageTime = new Date(msg.time).toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            });
            
            const avatar = msg.user.charAt(0).toUpperCase();
            
            return `
                <div class="message ${msg.own ? 'own' : ''}">
                    <div class="message-avatar">${avatar}</div>
                    <div class="message-bubble">
                        <div class="message-content">${msg.message}</div>
                        <div class="message-time">${messageTime}</div>
                    </div>
                </div>
            `;
        }
        
        // Load messages
        function loadMessages() {
            const messagesContainer = document.getElementById('chat-messages');
            messagesContainer.innerHTML = chatMessages
                .map(msg => renderMessage(msg))
                .join('');
        }
        
        // Scroll to bottom of chat
        function scrollToBottom() {
            const messagesContainer = document.getElementById('chat-messages');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        // Add new message
        function addMessage(message) {
            const newMessage = {
                id: messageId++,
                user: "You",
                message: message,
                time: new Date().toISOString(),
                own: true
            };
            
            chatMessages.push(newMessage);
            
            const messagesContainer = document.getElementById('chat-messages');
            messagesContainer.insertAdjacentHTML('beforeend', renderMessage(newMessage));
            
            scrollToBottom();
            
            // Simulate response after a delay
            setTimeout(() => {
                simulateResponse(message);
            }, 1000 + Math.random() * 2000);
        }
        
        // Simulate typing indicator and response
        function simulateResponse(originalMessage) {
            const typingIndicator = document.getElementById('typing-indicator');
            typingIndicator.style.display = 'flex';
            
            setTimeout(() => {
                typingIndicator.style.display = 'none';
                
                const responses = [
                    "That's a great point! I love how you're thinking about this 🤔",
                    "Thanks for sharing! This community is so supportive 💜",
                    "I totally agree! Good vibes all around ✨",
                    "Interesting perspective! I hadn't thought about it that way 🌟",
                    "Love the positive energy! Keep it up 🚀",
                    "This is exactly the kind of discussion I love to see 💪"
                ];
                
                const users = ['Alex', 'Sarah', 'Jordan', 'Taylor', 'Morgan'];
                const randomUser = users[Math.floor(Math.random() * users.length)];
                const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                
                const responseMessage = {
                    id: messageId++,
                    user: randomUser,
                    message: randomResponse,
                    time: new Date().toISOString(),
                    own: false
                };
                
                chatMessages.push(responseMessage);
                
                const messagesContainer = document.getElementById('chat-messages');
                messagesContainer.insertAdjacentHTML('beforeend', renderMessage(responseMessage));
                
                scrollToBottom();
            }, 2000);
        }
        
        // Handle message input
        function initializeChat() {
            const messageInput = document.getElementById('message-input');
            const sendButton = document.getElementById('send-button');
            
            function updateSendButton() {
                const hasText = messageInput.value.trim().length > 0;
                sendButton.disabled = !hasText;
            }
            
            function sendMessage() {
                const message = messageInput.value.trim();
                if (message) {
                    addMessage(message);
                    messageInput.value = '';
                    updateSendButton();
                    messageInput.focus();
                }
            }
            
            // Input event listeners
            messageInput.addEventListener('input', updateSendButton);
            
            messageInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage();
                }
            });
            
            sendButton.addEventListener('click', sendMessage);
            
            // Auto-resize textarea
            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });
            
            // Load initial messages
            loadMessages();
            
            // Focus input when chat is active
            setTimeout(() => {
                messageInput.focus();
            }, 500);
        }
        
        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize chat functionality
            initializeChat();
            
            // Simulate user count changes
            const userCount = document.getElementById('user-count');
            setInterval(() => {
                const count = 3 + Math.floor(Math.random() * 5);
                userCount.textContent = `${count} users online`;
            }, 10000);
        });
    </script>
</body>
</html>
